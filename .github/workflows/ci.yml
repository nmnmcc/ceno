name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            devenv shell bash -- -ec "
              devenv up &
              until curl -sf http://localhost:5984/ > /dev/null 2>&1; do sleep 1; done
              yarn install --immutable
              yarn effect-tsgo patch
              yarn check
              yarn test
            "
