name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Capture OIDC tokens
        id: oidc
        run: |
          echo "request_token=$ACTIONS_ID_TOKEN_REQUEST_TOKEN" >> "$GITHUB_OUTPUT"
          echo "request_url=$ACTIONS_ID_TOKEN_REQUEST_URL" >> "$GITHUB_OUTPUT"

      - uses: devcontainers/ci@v0.3
        with:
          env: |
            ACTIONS_ID_TOKEN_REQUEST_TOKEN=${{ steps.oidc.outputs.request_token }}
            ACTIONS_ID_TOKEN_REQUEST_URL=${{ steps.oidc.outputs.request_url }}
          runCmd: |
            devenv shell bash -- -ec "
              devenv up &
              until curl -sf http://localhost:5984/ > /dev/null 2>&1; do sleep 1; done
              yarn install --immutable
              yarn effect-tsgo patch
              yarn check
              yarn test
              yarn release
            "
