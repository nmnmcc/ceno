services:
  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 2s
      timeout: 5s
      retries: 10

  tests:
    build:
      context: ../..
      dockerfile: packages/couchdb/Dockerfile.test
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    depends_on:
      couchdb:
        condition: service_healthy
